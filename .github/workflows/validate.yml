name: Windows validation
on:
  push:
    branches: [main, 'dev/**', 'release/**']
  pull_request:
  workflow_dispatch:
env:
  POWERSHELL_TELEMETRY_OPTOUT: '1'
  POWERSHELL_UPDATECHECK: 'Off'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned test dependencies
        timeout-minutes: 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $modules = Join-Path $env:RUNNER_TEMP 'LivnModules'
          foreach ($spec in @(@{ Name = 'Pester'; Version = '5.6.1' }, @{ Name = 'PSScriptAnalyzer'; Version = '1.23.0' })) {
            $target = Join-Path (Join-Path $modules $spec.Name) $spec.Version
            $zip = Join-Path $env:RUNNER_TEMP ($spec.Name + '.zip')
            Write-Host ("Downloading {0} {1}" -f $spec.Name, $spec.Version)
            Invoke-WebRequest -UseBasicParsing -Uri ("https://www.powershellgallery.com/api/v2/package/{0}/{1}" -f $spec.Name, $spec.Version) -OutFile $zip -TimeoutSec 90
            Expand-Archive -LiteralPath $zip -DestinationPath $target -Force
            $manifest = Test-ModuleManifest (Join-Path $target ($spec.Name + '.psd1'))
            if ([string]$manifest.Version -ne $spec.Version) { throw 'Unexpected module version' }
          }
          "PSModulePath=$modules;$env:PSModulePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify complete ISLC bundle and power plans
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $PWD '_Files/ISLC'
          $original = Join-Path $bundle 'ISLC-v1.0.4.8-original.exe'
          if ((Get-FileHash -LiteralPath $original).Hash -ne '599315A1852B951E0ADAE2BE46FCE30BB32AAB7F8A4C9112471A5A88320E3085') { throw 'Original ISLC package hash mismatch' }
          $unpack = Join-Path $env:RUNNER_TEMP 'islc-reference'
          & 7z x $original "-o$unpack" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Cannot extract original ISLC package' }
          $reference = Join-Path $unpack 'ISLC v1.0.4.8'
          $files = @(Get-ChildItem -LiteralPath $reference -Recurse -File)
          if ($files.Count -lt 20) { throw 'Incomplete reference package' }
          foreach ($file in $files) {
            $relative = $file.FullName.Substring($reference.Length + 1)
            $target = Join-Path $bundle $relative
            if ((Get-FileHash -LiteralPath $target).Hash -ne (Get-FileHash -LiteralPath $file.FullName).Hash) { throw "Bundled file differs: $relative" }
          }
          $exe = Get-Item -LiteralPath (Join-Path $bundle 'Intelligent standby list cleaner ISLC.exe')
          if ($exe.VersionInfo.FileVersion -ne '1.0.4.8') { throw 'Unexpected ISLC version' }
          if (@(Get-ChildItem _Files -Recurse -Filter '*.pow').Count -ne 3) { throw 'Expected three power plans' }
          Write-Host "Verified $($files.Count) original ISLC files and three power plans; ISLC was not executed."
      - name: WPF and Framework smoke validation
        timeout-minutes: 3
        shell: powershell
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tools/Invoke-WindowsCheck.ps1
      # Main documentation may advance beyond the immutable published tag.
      # Release branches must carry an exact manifest before publication.
      - name: Verify release manifest
        if: ${{ !cancelled() && startsWith(github.ref, 'refs/heads/release/') }}
        shell: powershell
        run: ./tools/Build-Release.ps1 -Version 4.0.1 -CheckOnly
      - name: Parser and static analysis
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        shell: powershell
        run: ./tools/Invoke-Tests.ps1 -SkipPester
      - name: Memory tests (Windows PowerShell 5.1)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        shell: powershell
        run: ./tools/Invoke-Tests.ps1 -SkipAnalyzer
      - name: Build development archive
        shell: powershell
        run: ./tools/Build-Release.ps1 -Version 4.0.1 -Zip
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-validation
          path: tests/results/
      - name: Upload development archive
        uses: actions/upload-artifact@v4
        with:
          name: LivnTools-development
          path: dist/LivnTools-4.0.1.zip

  publish:
    name: Publish verified release
    needs: windows
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LivnTools-development
          path: dist
      - name: Publish versioned ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#release/}"
          version="${tag#v}"
          test "$tag" = "v4.0.1"
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME --jq .object.sha)" = "$GITHUB_SHA"
          test -s "dist/LivnTools-$version.zip"
          (cd dist && sha256sum "LivnTools-$version.zip" > SHA256SUMS.txt)
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace it."
            exit 1
          fi
          gh release create "$tag" "dist/LivnTools-$version.zip" dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "LivnTools $tag" \
            --notes-file "docs/releases/$tag.md" --draft
          gh release edit "$tag" --draft=false --latest
